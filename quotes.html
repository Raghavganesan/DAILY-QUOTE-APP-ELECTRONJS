<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 All Quotes</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Playfair Display", serif;
      background: linear-gradient(160deg, #fff7f8, #ffe3e9);
      color: #333;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
      overflow-y: auto;
    }

    h1 {
      color: #ff7b8a;
      margin-bottom: 30px;
      font-size: 1.8rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 700px;
      margin: 0 auto;
    }

    li {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      margin: 14px 0;
      padding: 18px 22px;
      font-style: italic;
      box-shadow: 0 6px 20px rgba(255, 120, 140, 0.15);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.5s ease forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button, a.back {
      margin-top: 25px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff9aa2, #ff7b8a);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-block;
      box-shadow: 0 5px 12px rgba(255, 120, 140, 0.3);
    }

    button:hover, a.back:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(255, 120, 140, 0.4);
    }

    @media (max-width: 600px) {
      li {
        font-size: 0.9rem;
        padding: 14px 18px;
      }
      button, a.back {
        font-size: 0.85rem;
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>
  <h1>🌼 All Daily Quotes</h1>
  <ul id="quoteList"><li>Loading quotes...</li></ul>
  <button onclick="loadQuotes()">🔄 Load New Quotes</button>
  <br />
  <a class="back" href="#" onclick="window.close()">← Back</a>

  <script>
    async function loadQuotes() {
      try {
        const response = await fetch("https://zenquotes.io/api/quotes");
        const data = await response.json();
        const quoteList = document.getElementById("quoteList");
        quoteList.innerHTML = "";

        data.slice(0, 15).forEach((q, index) => {
          const li = document.createElement("li");
          li.textContent = `“${q.q}” — ${q.a}`;
          li.style.animationDelay = `${index * 0.08}s`;
          quoteList.appendChild(li);
        });
      } catch (error) {
        console.error(error);
        document.getElementById("quoteList").innerHTML =
          "<li>⚠️ Unable to load quotes. Please try again later.</li>";
      }
    }

    loadQuotes();
  </script>
</body>
</html>
