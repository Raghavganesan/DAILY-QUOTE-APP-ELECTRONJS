<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
    font-family: "Playfair Display", serif;
      background: linear-gradient(160deg, #fff7f8, #ffe3e9);
      color: #333;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }
    h1{
        color: #ff7b8a;
        margin-bottom: 20px;
        font-size: 1.8rem;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
    }
      textarea {
      width: 90%;
      max-width: 600px;
      height: 200px;
      border-radius: 12px;
      border: 2px solid #ffb0ba;
      padding: 15px;
      font-size: 1rem;
      font-family: "Playfair Display", serif;
      outline: none;
      resize: none;
      box-shadow: 0 4px 12px rgba(255, 155, 165, 0.2);
      transition: box-shadow 0.3s;
    }
      textarea:focus {
      box-shadow: 0 0 10px rgba(255, 155, 165, 0.5);
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, a.back {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff9aa2, #ff7b8a);
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(255, 120, 140, 0.3);
      text-decoration: none;
      display: inline-block;
    }

    button:hover, a.back:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(255, 120, 140, 0.4);
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 600px;
      margin: 30px auto 0;
      text-align: left;
    }

    li {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      border-radius: 10px;
      padding: 10px 15px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-style: italic;
      box-shadow: 0 4px 8px rgba(255, 120, 140, 0.15);
    }

    li button {
      background: none;
      color: #ff7b8a;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    li button:hover {
      color: #d04d5f;
    }
</style>
<body>
    <h1>📝 My Notes</h1>
    <textarea id="noteInput" placeholder="Write your thoughts here..."></textarea>
    <div class="buttons">
        <button id="saveNote">💾 Save Note</button>
        <button id="clearNotes">🗑️ Clear All</button>
        <a class="back" href="#" onclick="window.close()">← Back</a>
  </div>
  <ul id="noteList"></ul>
   <script>
    const noteInput = document.getElementById("noteInput");
    const noteList = document.getElementById("noteList");

    function loadNotes() {
      const notes = JSON.parse(localStorage.getItem("myNotes") || "[]");
      noteList.innerHTML = "";
      notes.forEach((note, index) => {
        const li = document.createElement("li");
        li.textContent = note;
        const delBtn = document.createElement("button");
        delBtn.textContent = "✖";
        delBtn.onclick = () => deleteNote(index);
        li.appendChild(delBtn);
        noteList.appendChild(li);
      });
    }
      function saveNote() {
      const text = noteInput.value.trim();
      if (text === "") return alert("Write something first!");
      const notes = JSON.parse(localStorage.getItem("myNotes") || "[]");
      notes.push(text);
      localStorage.setItem("myNotes", JSON.stringify(notes));
      noteInput.value = "";
      loadNotes();
    }

    function deleteNote(index) {
      const notes = JSON.parse(localStorage.getItem("myNotes") || "[]");
      notes.splice(index, 1);
      localStorage.setItem("myNotes", JSON.stringify(notes));
      loadNotes();
    }

    function clearAll() {
      if (confirm("Delete all notes?")) {
        localStorage.removeItem("myNotes");
        loadNotes();
      }
    }

    document.getElementById("saveNote").addEventListener("click", saveNote);
    document.getElementById("clearNotes").addEventListener("click", clearAll);

    loadNotes();
  </script>
</body>
</html>
